name: Empaquetat
on:
  push:
    branches:
       - test
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalem pyinstaller
        run: pip install -r pyinstaller

      - name: Instalacio Paquets
        run: pip install -r requirements.txt

      - name: Execucio comprova desplegaments
        run: python comprova_desplegaments.py example.com

      - name: Empaquetem
        run: pyinstaller --onefile comprova_desplegaments.py

      - name: Guardem l'executable
        uses: actions/upload-artifact@v4
        with:
          name: executable-linux
          path: dist/comprova_desplegaments

  build-windowa:
    runs-on: windows-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurem Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalem pyinstaller
        run: pip install -r pyinstaller

      - name: Instalacio Paquets
        run: pip install -r requirements.txt

      - name: Execucio comprova desplegaments
        run: python comprova_desplegaments.py example.com

      - name: Empaquetem
        run: pyinstaller --onefile comprova_desplegaments.py

      - name: Guardem l'executable
        uses: actions/upload-artifact@v4
        with:
          name: executable-windows
          path: dist/comprova_desplegaments

